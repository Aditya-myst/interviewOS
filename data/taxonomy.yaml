# InterviewOS skill taxonomy v1
# Purpose: single vocabulary shared by resume parsing, JD parsing, matching and the roadmap.
# Rules:
#   - `id` is stable forever; never rename it (rows in candidate_skills point at it).
#   - `aliases` are matched case-insensitively by Aho-Corasick with word boundaries.
#   - `interview_relevance` (0..1) is the default weight when a skill is NOT in the JD.
#   - `subtopics` define the curriculum graph. The teaching agent never invents a syllabus.
version: 1
updated: "2026-11-01"

skills:
  - id: python
    name: Python
    category: Language
    aliases: [python3, "python 3", py]
    interview_relevance: 0.9
    subtopics:
      - { id: syntax-types, title: "Syntax and data types", level: beginner, objective: "Explain mutability, truthiness and slicing confidently." }
      - { id: functions-scope, title: "Functions, closures and scope", level: beginner, objective: "Reason about LEGB and default-argument pitfalls." }
      - { id: oop-dataclasses, title: "OOP and dataclasses", level: intermediate, objective: "Choose between classes, dataclasses and plain dicts." }
      - { id: async-io, title: "Async I/O and the event loop", level: advanced, objective: "Know when I/O bound code must be async, and what blocks the loop." }
      - { id: typing-testing, title: "Type hints and pytest", level: intermediate, objective: "Write typed code and test it without a framework fight." }
      - { id: packaging, title: "Packaging, venvs and dependencies", level: beginner, objective: "Own a reproducible environment." }

