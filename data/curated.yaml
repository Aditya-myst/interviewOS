# InterviewOS curated resource catalogue (Tier 0)
# These win over any search result. The resolver still re-validates every URL at runtime
# (HTTP GET, 200, no login wall) and stamps `verified_at`. `verified: false` means the
# link is trusted by hand but not yet machine-checked in this environment.
# Keyed by skill id -> subtopic id -> resources (role: concept | practice | checkpoint)
